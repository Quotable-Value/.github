name: NodeJS Frontend QA

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the frontend package.json.
        required: false
        type: string
        default: .
      node-version:
        description: Node.js version to install before running npm commands.
        required: false
        type: string
        default: '20'
      runner:
        description: Runner label to use for frontend checks.
        required: false
        type: string
        default: ubuntu-latest
      install-command:
        description: Dependency installation command.
        required: false
        type: string
        default: npm install
      lint-command:
        description: Lint command.
        required: false
        type: string
        default: npm run lint
      coverage-command:
        description: Unit test coverage command.
        required: false
        type: string
        default: npm run coverage
      build-command:
        description: Frontend build command.
        required: false
        type: string
        default: npm run build

permissions:
  contents: read

jobs:
  linting:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: ${{ inputs.install-command }}
      - name: Run linting
        run: ${{ inputs.lint-command }}

  unit:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: ${{ inputs.install-command }}
      - name: Run unit tests with coverage
        run: ${{ inputs.coverage-command }}

  build:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: ${{ inputs.install-command }}
      - name: Run frontend build
        run: ${{ inputs.build-command }}
