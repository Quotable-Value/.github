name: SBT Kubernetes QA

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing build.sbt.
        required: false
        type: string
        default: .
      java-version:
        description: Java version to install before running SBT.
        required: false
        type: string
        default: '8'
      runner:
        description: Runner label to use for SBT checks.
        required: false
        type: string
        default: ubuntu-latest
      codebuild-project-name:
        description: CodeBuild project name used to build the runner label.
        required: false
        type: string
        default: ''
      aws-region:
        description: AWS region for CodeArtifact authentication.
        required: false
        type: string
        default: ap-southeast-2
      aws-role-to-assume:
        description: AWS role ARN used to access CodeArtifact.
        required: false
        type: string
        default: arn:aws:iam::948396734470:role/github-actions-codeartifact-read
      coverage-command:
        description: SBT coverage command.
        required: false
        type: string
        default: sbt jacoco
      package-command:
        description: Kubernetes package verification command. Set to an empty string to skip.
        required: false
        type: string
        default: sbt -DbuildTarget=kubernetes docker:stage
      jacoco-report-directory:
        description: Directory containing the Jacoco report, relative to working-directory. Leave empty to skip PR comments.
        required: false
        type: string
        default: ''
      jacoco-package-row-limit:
        description: Maximum package rows to include in the Jacoco PR comment.
        required: false
        type: number
        default: 20

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  coverage:
    runs-on: ${{ inputs.codebuild-project-name != '' && format('codebuild-{0}-{1}-{2}', inputs.codebuild-project-name, github.run_id, github.run_attempt) || inputs.runner }}
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare report metadata
        id: qa-meta
        run: |
          suffix='${{ inputs.working-directory }}'
          if [ "$suffix" = "." ]; then suffix="root"; fi
          suffix=$(printf '%s' "$suffix" | sed -E 's#[^A-Za-z0-9_.-]+#-#g')
          echo "artifact_suffix=$suffix" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ inputs.aws-role-to-assume != '' || vars.AWS_CODEARTIFACT_READ_ROLE_ARN != '' }}
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume || vars.AWS_CODEARTIFACT_READ_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
      - name: Export CodeArtifact token
        if: ${{ inputs.aws-role-to-assume != '' || vars.AWS_CODEARTIFACT_READ_ROLE_ARN != '' }}
        run: |
          CODEARTIFACT_TOKEN=$(aws codeartifact get-authorization-token --domain quotable-value --domain-owner 948396734470 --region "${{ inputs.aws-region }}" --query authorizationToken --output text)
          echo "::add-mask::$CODEARTIFACT_TOKEN"
          echo "CODEARTIFACT_TOKEN=$CODEARTIFACT_TOKEN" >> "$GITHUB_ENV"
      - name: Fetch tags
        run: git fetch --tags --force
      - name: Run SBT coverage
        id: coverage
        run: ${{ inputs.coverage-command }}
      - name: Upload Jacoco HTML report
        id: jacoco-artifact
        if: ${{ always() && inputs.jacoco-report-directory != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sbt-jacoco-${{ steps.qa-meta.outputs.artifact_suffix }}-html-report
          if-no-files-found: ignore
          path: ${{ inputs.working-directory }}/${{ inputs.jacoco-report-directory }}/html/**
      - name: Write Jacoco summary
        id: jacoco-summary
        if: ${{ always() && inputs.jacoco-report-directory != '' }}
        env:
          ARTIFACT_URL: ${{ steps.jacoco-artifact.outputs.artifact-url }}
          COMMENT_FILE: ${{ runner.temp }}/sbt-jacoco-${{ steps.qa-meta.outputs.artifact_suffix }}.md
          COVERAGE_COMMAND: ${{ inputs.coverage-command }}
          COVERAGE_RESULT: ${{ steps.coverage.outcome || 'skipped' }}
          JACOCO_PACKAGE_ROW_LIMIT: ${{ inputs.jacoco-package-row-limit }}
          JACOCO_REPORT_DIRECTORY: ${{ inputs.jacoco-report-directory }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          echo "comment_file=$COMMENT_FILE" >> "$GITHUB_OUTPUT"

          python3 <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def int_attr(element, name):
            try:
              return int(element.get(name, "0"))
            except ValueError:
              return 0

          def counter(element, counter_type):
            for item in element.findall("counter"):
              if item.get("type") == counter_type:
                return int_attr(item, "covered"), int_attr(item, "missed")
            return 0, 0

          def percent(covered, missed):
            total = covered + missed
            if total == 0:
              return "n/a"
            return f"{covered * 100 / total:.2f}%"

          def markdown_escape(value):
            return str(value).replace("|", "\\|").replace("\n", " ")

          def row(metric, covered, missed):
            total = covered + missed
            return f"| {metric} | {covered} | {missed} | {total} | {percent(covered, missed)} |"

          comment_file = Path(os.environ["COMMENT_FILE"])
          xml_file = Path(os.environ["JACOCO_REPORT_DIRECTORY"]) / "jacoco.xml"
          if not xml_file.is_file():
            comment_file.write_text("", encoding="utf-8")
            sys.exit(0)

          try:
            root = ET.parse(xml_file).getroot()
          except ET.ParseError:
            comment_file.write_text("", encoding="utf-8")
            sys.exit(0)

          metrics = [
            ("Lines", "LINE"),
            ("Branches", "BRANCH"),
            ("Methods", "METHOD"),
            ("Instructions", "INSTRUCTION"),
          ]

          try:
            package_limit = int(os.environ.get("JACOCO_PACKAGE_ROW_LIMIT", "20"))
          except ValueError:
            package_limit = 20
          package_limit = max(package_limit, 0)

          total_rows = [row(label, *counter(root, counter_type)) for label, counter_type in metrics]
          packages = []
          for package in root.findall("package"):
            name = package.get("name", "").replace("/", ".") or "(default)"
            line_covered, line_missed = counter(package, "LINE")
            branch_covered, branch_missed = counter(package, "BRANCH")
            method_covered, method_missed = counter(package, "METHOD")
            if line_covered + line_missed + branch_covered + branch_missed + method_covered + method_missed == 0:
              continue
            packages.append({
              "name": name,
              "line_missed": line_missed,
              "lines": percent(line_covered, line_missed),
              "branches": percent(branch_covered, branch_missed),
              "methods": percent(method_covered, method_missed),
            })

          packages.sort(key=lambda item: (-item["line_missed"], item["name"]))
          visible_packages = packages[:package_limit] if package_limit else []

          artifact_url = os.environ.get("ARTIFACT_URL", "")
          artifact_line = "- HTML report: not uploaded"
          if artifact_url:
            artifact_line = f"- HTML report: [workflow artifact]({artifact_url})"

          lines = [
            "### SBT Jacoco coverage",
            "",
            f"- Working directory: `{os.environ.get('WORKING_DIRECTORY', '.')}`",
            f"- Command: `{os.environ.get('COVERAGE_COMMAND', '')}`",
            f"- Result: `{os.environ.get('COVERAGE_RESULT', 'skipped')}`",
            artifact_line,
            "",
            "#### Totals",
            "",
            "| Metric | Covered | Missed | Total | Coverage |",
            "| --- | ---: | ---: | ---: | ---: |",
            *total_rows,
          ]

          if visible_packages:
            lines.extend([
              "",
              "#### Packages",
              "",
              "| Package | Lines | Branches | Methods |",
              "| --- | ---: | ---: | ---: |",
            ])
            for package in visible_packages:
              lines.append(
                f"| {markdown_escape(package['name'])} | {package['lines']} | {package['branches']} | {package['methods']} |"
              )
            if len(packages) > len(visible_packages):
              lines.append("")
              lines.append(f"Showing {len(visible_packages)} of {len(packages)} packages, sorted by missed lines.")

          comment_file.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          if [ -s "$COMMENT_FILE" ]; then
            cat "$COMMENT_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "has_structured_summary=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Jacoco XML report was found." >> "$GITHUB_STEP_SUMMARY"
            echo "has_structured_summary=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/github-script@v7
        if: ${{ always() && github.event_name == 'pull_request' && steps.jacoco-summary.outputs.has_structured_summary == 'true' }}
        env:
          COMMENT_FILE: ${{ steps.jacoco-summary.outputs.comment_file }}
          COMMENT_MARKER: '<!-- qv-qa-summary:sbt-jacoco:${{ steps.qa-meta.outputs.artifact_suffix }} -->'
        with:
          script: |
            const fs = require('fs');
            const marker = process.env.COMMENT_MARKER;
            const body = `${marker}\n${fs.readFileSync(process.env.COMMENT_FILE, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  kubernetes-package:
    if: ${{ inputs.package-command != '' }}
    runs-on: ${{ inputs.codebuild-project-name != '' && format('codebuild-{0}-{1}-{2}', inputs.codebuild-project-name, github.run_id, github.run_attempt) || inputs.runner }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: ${{ inputs.java-version }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ inputs.aws-role-to-assume != '' || vars.AWS_CODEARTIFACT_READ_ROLE_ARN != '' }}
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume || vars.AWS_CODEARTIFACT_READ_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
      - name: Export CodeArtifact token
        if: ${{ inputs.aws-role-to-assume != '' || vars.AWS_CODEARTIFACT_READ_ROLE_ARN != '' }}
        run: |
          CODEARTIFACT_TOKEN=$(aws codeartifact get-authorization-token --domain quotable-value --domain-owner 948396734470 --region "${{ inputs.aws-region }}" --query authorizationToken --output text)
          echo "::add-mask::$CODEARTIFACT_TOKEN"
          echo "CODEARTIFACT_TOKEN=$CODEARTIFACT_TOKEN" >> "$GITHUB_ENV"
      - name: Fetch tags
        run: git fetch --tags --force
      - name: Verify Kubernetes package
        run: ${{ inputs.package-command }}
